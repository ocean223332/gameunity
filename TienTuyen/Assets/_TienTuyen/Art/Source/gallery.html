<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tiền Tuyến — Thư viện mô hình 3D</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--line:#263454;--text:#edf3ff;--muted:#aebbd4;--accent:#76a9ff}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 25% 0,#172649 0,#0b1020 42%,#070b15 100%);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{padding:22px 28px 12px;border-bottom:1px solid var(--line);background:#0d1425e8;backdrop-filter:blur(8px);position:sticky;top:0;z-index:2} h1{margin:0 0 4px;font-size:24px;letter-spacing:.2px} header p{margin:0;color:var(--muted)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;max-width:1500px;margin:0 auto;padding:16px}
aside{background:#0f1729d9;border:1px solid var(--line);border-radius:12px;padding:12px;height:calc(100vh - 116px);min-height:500px;overflow:auto} aside h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:4px 8px 10px} button{width:100%;display:flex;justify-content:space-between;align-items:center;background:transparent;color:var(--text);border:1px solid transparent;border-radius:8px;padding:9px 10px;margin:2px 0;text-align:left;cursor:pointer;font-size:14px} button:hover{background:#1a2745;border-color:#2d4471} button.active{background:#20365f;border-color:var(--accent);box-shadow:0 0 0 1px #76a9ff44 inset} .kind{color:var(--muted);font-size:11px}
main{min-width:0}.viewer{height:calc(100vh - 165px);min-height:500px;position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#17233d,#090e1b 74%)} canvas{display:block;width:100%;height:100%}.hud{position:absolute;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.title{background:#0c1424cc;border:1px solid #2c416d;border-radius:9px;padding:10px 12px;backdrop-filter:blur(5px)}.title strong{display:block;font-size:18px}.title span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.hint{background:#0c1424aa;border:1px solid #263454;border-radius:8px;padding:8px 10px;color:var(--muted);font-size:12px;text-align:right}.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--muted);background:#0c1424dd;border:1px solid var(--line);padding:10px 14px;border-radius:8px}.footer{color:var(--muted);font-size:12px;padding:8px 2px}.error{color:#ffb4b4}
@media(max-width:760px){.layout{grid-template-columns:1fr}.layout aside{height:auto;max-height:220px;min-height:0}.viewer{height:65vh;min-height:420px}.hint{display:none}}
</style>
</head>
<body>
<header><h1>Tiền Tuyến — mô hình 3D</h1><p>Thư viện các asset Blender của game, xem bằng bản GLB đã xuất. Kéo để xoay · cuộn để phóng to · nhấn các nút bên trái để đổi mẫu.</p></header>
<div class="layout"><aside><h2>16 mô hình</h2><div id="modelList"></div><div class="footer">Nguồn: <code>Art/Source/Blend</code><br>Bản xem: <code>Art/Source/GLB</code></div></aside><main><div class="viewer"><canvas id="canvas"></canvas><div class="hud"><div class="title"><strong id="modelName">—</strong><span id="modelPath">Đang tải…</span></div><div class="hint">Orbit: kéo chuột<br>Zoom: con lăn<br>Pan: chuột phải</div></div><div id="status" class="status">Đang khởi tạo…</div></div></main></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.161.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';
import {OrbitControls} from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'https://unpkg.com/three@0.161.0/examples/jsm/loaders/GLTFLoader.js';
const models = ['hero','enemy_shooter','enemy_infantry','enemy_elite','enemy_charger','crate','supply_crate','grass','bush','tree','rock','sandbag','tarp','rifle','smg','shotgun'];
const labels = {hero:'Hero',enemy_shooter:'Enemy Shooter',enemy_infantry:'Enemy Infantry',enemy_elite:'Enemy Elite',enemy_charger:'Enemy Charger',crate:'Crate',supply_crate:'Supply Crate',grass:'Grass',bush:'Bush',tree:'Tree',rock:'Rock',sandbag:'Sandbag',tarp:'Tarp',rifle:'Rifle',smg:'SMG',shotgun:'Shotgun'};
const root='./GLB/';
const list=document.getElementById('modelList'); const nameEl=document.getElementById('modelName'); const pathEl=document.getElementById('modelPath'); const status=document.getElementById('status');
for(const id of models){const b=document.createElement('button'); b.dataset.id=id; b.innerHTML=`<span>${labels[id]}</span><span class="kind">.blend</span>`; b.onclick=()=>loadModel(id); list.appendChild(b)}
const canvas=document.getElementById('canvas'); const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.shadowMap.enabled=true;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0d1629); const camera=new THREE.PerspectiveCamera(45,1,.01,1000); camera.position.set(2.8,1.8,3.8);
const controls=new OrbitControls(camera,canvas); controls.enableDamping=true; controls.target.set(0,0.7,0); controls.minDistance=.15; controls.maxDistance=30;
scene.add(new THREE.HemisphereLight(0xbfd5ff,0x26324a,2.0)); const key=new THREE.DirectionalLight(0xffffff,3.0); key.position.set(4,7,5); key.castShadow=true; scene.add(key); const fill=new THREE.DirectionalLight(0x79a9ff,1.3); fill.position.set(-4,2,-3); scene.add(fill);
const floor=new THREE.Mesh(new THREE.CircleGeometry(5,96),new THREE.MeshStandardMaterial({color:0x111b30,roughness:.92,metalness:.02})); floor.rotation.x=-Math.PI/2; floor.position.y=-.02; floor.receiveShadow=true; scene.add(floor);
const grid=new THREE.GridHelper(10,20,0x2c426b,0x1a2a48); grid.position.y=-.01; scene.add(grid);
const loader=new GLTFLoader(); let current=null; let loadToken=0;
function resize(){const r=canvas.getBoundingClientRect(); const w=Math.max(1,r.width),h=Math.max(1,r.height); renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix()} addEventListener('resize',resize); resize();
function frame(obj){const box=new THREE.Box3().setFromObject(obj); const size=box.getSize(new THREE.Vector3()); const center=box.getCenter(new THREE.Vector3()); const maxDim=Math.max(size.x,size.y,size.z)||1; obj.position.sub(center); obj.position.y += size.y/2; const dist=maxDim*1.65; camera.position.set(dist*.95,dist*.65,dist*1.1); controls.target.set(0,size.y*.35,0); controls.minDistance=Math.max(maxDim*.2,.02); controls.maxDistance=maxDim*12; controls.update()}
async function loadModel(id){const token=++loadToken; document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===id)); nameEl.textContent=labels[id]; pathEl.textContent=`Source/Blend/${id}.blend  ·  xem qua GLB`; status.className='status'; status.textContent='Đang tải mô hình…'; if(current){scene.remove(current);current.traverse(o=>{if(o.geometry)o.geometry.dispose(); if(o.material){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>m.dispose&&m.dispose())}});current=null}
try{const gltf=await loader.loadAsync(root+id+'.glb'); if(token!==loadToken)return; current=gltf.scene; current.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true; if(o.material){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{m.side=THREE.DoubleSide})}}}); scene.add(current); frame(current); status.style.display='none'}catch(e){if(token!==loadToken)return; status.className='status error'; status.textContent='Không tải được '+id+'.glb'; console.error(e)}}
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)} animate(); loadModel(models[0]);
</script>
</body></html>
